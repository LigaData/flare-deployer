{{- /* Application secrets. Values come from the deployer (GENERATED_PASSWORD properties) or from the
       command line; a random value is used when none is given (helm template / direct installs). */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-ligadata-app
  labels:
{{ include "flare.labels" . | indent 4 }}
type: Opaque
data:
  DBuser: {{ .Values.database.user | b64enc }}
  DBpwd: {{ .Values.database.password | default (randAlphaNum 24) | b64enc }}
  DI_secretKey: {{ .Values.secrets.diSecret | default (randAlphaNum 32) | b64enc }}
  SAPI_SEC_KEY: {{ .Values.secrets.sapiSecKey | default (randAlphaNum 32) | b64enc }}
  repo_user: {{ .Values.secrets.repoUser | b64enc }}
  repo_pwd: {{ .Values.secrets.repoPassword | b64enc }}
  repo_mail: {{ .Values.secrets.repoEmail | b64enc }}
---
# web UI logins: the administrator the UI seeds on first start and the pipeline user the setup job creates
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-ligadata-ui-users
  labels:
{{ include "flare.labels" . | indent 4 }}
type: Opaque
data:
  admin: {{ .Values.ui.adminPassword | default (printf "%s%s%s!%s" (randAlpha 3 | upper) (randAlpha 5 | lower) (randNumeric 3) (randAlphaNum 4)) | b64enc }}
  pipelineUser: {{ .Values.users.pipelineUser.password | default (printf "%s%s%s!%s" (randAlpha 3 | upper) (randAlpha 5 | lower) (randNumeric 3) (randAlphaNum 4)) | b64enc }}
{{- if .Values.license.p7sBase64 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-ligadata-license
  labels:
{{ include "flare.labels" . | indent 4 }}
type: Opaque
data:
  license.p7s: {{ .Values.license.p7sBase64 }}
  trusted-root.fingerprint: {{ .Values.license.trustedRootFingerprint | b64enc }}
{{- end }}
